<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>IsidoreAI</title><meta name="description" content="IsidoreAI, votre assistant intelligent"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.png"><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#64748b;--border:#e2e8f0;--accent:#2563eb;--user:#dbeafe;--input:#fff}body.dark{--bg:#0b1220;--panel:#111b2e;--text:#e5edf9;--muted:#9aabc4;--border:#26344b;--accent:#60a5fa;--user:#1e3a5f;--input:#0f192b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}button,textarea{font:inherit}button{cursor:pointer}.app{display:flex;height:100dvh}.sidebar{width:275px;flex:0 0 275px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:12px;z-index:20}.brand{display:flex;align-items:center;gap:10px;padding:8px 5px;font-weight:800;font-size:21px}.brand-icon,.welcome-logo{background:var(--accent);color:white;display:grid;place-items:center;font-weight:800}.brand-icon{width:36px;height:36px;border-radius:12px}.primary,.secondary,.icon-button{border:1px solid var(--border);border-radius:12px;padding:10px 12px;color:var(--text);background:var(--panel)}.primary{background:var(--accent);color:#fff;border:0;font-weight:650}.sidebar-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:10px 5px 0}.history{overflow:auto;display:flex;flex-direction:column;gap:5px}.history-item{text-align:left;border:0;border-radius:10px;padding:10px;background:transparent;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-item:hover,.history-item.active{background:var(--bg)}.sidebar-bottom{margin-top:auto;display:grid;gap:8px}.main{min-width:0;flex:1;display:flex;flex-direction:column;height:100%}.topbar{height:60px;flex:0 0 60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);background:var(--panel)}.topbar-title{font-weight:700}.conversation{flex:1;overflow-y:auto;padding:24px 16px}.welcome{max-width:760px;margin:7vh auto 0;text-align:center}.welcome-logo{width:60px;height:60px;margin:0 auto 18px;border-radius:20px;font-size:27px}.welcome h1{font-size:clamp(27px,4vw,38px);margin:0 0 10px}.welcome p{color:var(--muted);line-height:1.6}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:26px;text-align:left}.suggestion{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--text);text-align:left}.suggestion strong,.suggestion span{display:block}.suggestion span{color:var(--muted);font-size:13px;margin-top:4px}.message-list{max-width:850px;margin:0 auto;display:flex;flex-direction:column;gap:20px}.message{display:flex;gap:12px;line-height:1.65;overflow-wrap:anywhere}.avatar{flex:0 0 34px;width:34px;height:34px;display:grid;place-items:center;border-radius:11px;font-size:12px;font-weight:800;background:var(--border)}.message.user .avatar{background:var(--accent);color:white}.message-body{min-width:0;flex:1;padding-top:3px}.message-name{font-size:13px;font-weight:750;margin-bottom:5px;color:var(--muted)}.message-content p{margin:0 0 10px}.message-content h3{font-size:1.08em;margin:14px 0 7px}.message-content pre{white-space:pre-wrap;overflow:auto;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--border)}.message-content code{font-family:ui-monospace,Consolas,monospace}.message-content ul{padding-left:22px}.loading{display:inline-flex;gap:5px;margin:5px 0}.loading span{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:bounce 1.2s infinite}.loading span:nth-child(2){animation-delay:.15s}.loading span:nth-child(3){animation-delay:.3s}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}.composer-wrap{padding:12px 16px 15px;background:var(--bg)}.composer{max-width:850px;margin:auto;display:flex;align-items:flex-end;gap:10px;padding:10px;border:1px solid var(--border);background:var(--input);border-radius:18px}#question{flex:1;resize:none;max-height:180px;min-height:44px;padding:10px 8px;border:0;outline:0;background:transparent;color:var(--text);line-height:1.5}#sendButton{width:44px;height:44px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:20px}#sendButton:disabled{opacity:.55;cursor:wait}.disclaimer{max-width:850px;margin:8px auto 0;text-align:center;color:var(--muted);font-size:11px}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:15}.overlay.show{display:block}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 15px;border-radius:10px;z-index:50;max-width:90vw;display:none}.toast.show{display:block}@media(max-width:720px){.sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-105%);transition:transform .2s;box-shadow:0 8px 30px #0002}.sidebar.open{transform:translateX(0)}.topbar{padding:0 10px}.conversation{padding:18px 11px}.composer-wrap{padding:10px}.suggestions{grid-template-columns:1fr}.welcome{margin-top:4vh}}
</style></head>
<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">I</div><span>IsidoreAI</span></div><button class="primary" id="newChatButton">＋ Nouvelle conversation</button><div class="sidebar-label">Historique</div><div class="history" id="history"></div><div class="sidebar-bottom"><button class="secondary" id="themeButton">🌙 Mode sombre</button><button class="secondary" id="clearHistoryButton">🗑️ Effacer l’historique</button></div></aside><div class="overlay" id="overlay"></div><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="icon-button" id="menuButton" aria-label="Menu">☰</button><div class="topbar-title">IsidoreAI <span style="color:var(--muted);font-weight:400;font-size:12px">Assistant intelligent</span></div></div><button class="icon-button" id="newChatTopButton" title="Nouvelle conversation">＋</button></header><section class="conversation" id="conversation" aria-live="polite"><div class="welcome" id="welcome"><div class="welcome-logo">I</div><h1>Comment puis-je vous aider ?</h1><p>Posez une question, demandez une explication ou soumettez un exercice. IsidoreAI vous répond en français ou en anglais.</p><div class="suggestions"><button class="suggestion" data-prompt="Explique-moi une notion difficile étape par étape."><strong>📘 Apprendre</strong><span>Expliquer une notion clairement</span></button><button class="suggestion" data-prompt="Résous cet exercice et montre toutes les étapes : "><strong>🧮 Résoudre un exercice</strong><span>Comprendre chaque étape du calcul</span></button><button class="suggestion" data-prompt="Aide-moi à préparer une leçon d’anglais pour mes élèves."><strong>✍️ Préparer une leçon</strong><span>Créer une fiche pédagogique</span></button><button class="suggestion" data-prompt="Traduis ce texte en anglais et explique le vocabulaire : "><strong>🌐 Traduire</strong><span>Traduction et vocabulaire</span></button></div></div><div class="message-list" id="messageList"></div></section><div class="composer-wrap"><form class="composer" id="composer"><textarea id="question" rows="1" placeholder="Écrivez votre question…" aria-label="Votre question"></textarea><button id="sendButton" type="submit" aria-label="Envoyer">➤</button></form><div class="disclaimer">Vérifiez les informations importantes. IsidoreAI peut parfois se tromper.</div></div></main></div><div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const $=s=>document.querySelector(s), conversationEl=$("#conversation"),messageList=$("#messageList"),welcome=$("#welcome"),questionInput=$("#question"),sendButton=$("#sendButton"),composer=$("#composer"),historyEl=$("#history"),sidebar=$("#sidebar"),overlay=$("#overlay"),toastEl=$("#toast");
let conversations=[],activeId=null,sending=false,toastTimer=null;
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function loadConversations(){try{const x=JSON.parse(localStorage.getItem("isidoreai_conversations")||"[]");conversations=Array.isArray(x)?x:[]}catch(e){conversations=[]}if(conversations.length)activeId=conversations[0].id}
function saveConversations(){try{localStorage.setItem("isidoreai_conversations",JSON.stringify(conversations.slice(0,80)))}catch(e){showToast("Impossible d’enregistrer l’historique sur cet appareil.")}}
function getActiveConversation(){return conversations.find(x=>x.id===activeId)||null}
function ensureConversation(title="Nouvelle conversation"){let c=getActiveConversation();if(!c){c={id:makeId(),title:title.slice(0,42)||"Nouvelle conversation",messages:[],updatedAt:Date.now()};conversations.unshift(c);activeId=c.id}return c}
function renderHistory(){historyEl.replaceChildren();conversations.forEach(c=>{const b=document.createElement("button");b.className="history-item"+(c.id===activeId?" active":"");b.textContent=c.title||"Nouvelle conversation";b.title=b.textContent;b.addEventListener("click",()=>openConversation(c.id));historyEl.appendChild(b)})}
function appendMessage(role,text,opts={}){const row=document.createElement("article");row.className="message "+role;if(opts.loading)row.dataset.loading="true";const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="user"?"Vous":"I";const body=document.createElement("div");body.className="message-body";const name=document.createElement("div");name.className="message-name";name.textContent=role==="user"?"Vous":"IsidoreAI";const content=document.createElement("div");content.className="message-content";if(opts.loading)content.innerHTML='<div class="loading" aria-label="IsidoreAI réfléchit"><span></span><span></span><span></span></div>';else if(role==="user"){const p=document.createElement("p");p.textContent=text;content.appendChild(p)}else content.innerHTML=formatAI(text);body.append(name,content);row.append(avatar,body);messageList.appendChild(row);faireDefiler();if(!opts.loading&&role!=="user")typesetMath(content);return row}
function renderConversation(){messageList.replaceChildren();const c=getActiveConversation(),messages=c?c.messages:[];welcome.style.display=messages.length?"none":"block";messages.forEach(m=>appendMessage(m.role,m.text));renderHistory();faireDefiler()}
function openConversation(id){activeId=id;renderConversation();closeMenuPanel()}
function newConversation(){activeId=null;messageList.replaceChildren();welcome.style.display="block";renderHistory();questionInput.focus();closeMenuPanel()}
function openMenuPanel(){sidebar.classList.add("open");overlay.classList.add("show")}function closeMenuPanel(){sidebar.classList.remove("open");overlay.classList.remove("show")}
function showToast(s){toastEl.textContent=s;toastEl.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove("show"),3500)}
function faireDefiler(){requestAnimationFrame(()=>conversationEl.scrollTop=conversationEl.scrollHeight)}
function typesetMath(el){if(window.MathJax&&typeof MathJax.typesetPromise==="function")MathJax.typesetPromise([el]).catch(()=>{})}
function formatAI(text){let safe=String(text??"");const formulas=[];function protect(f){const id=`___FORMULA_${formulas.length}___`;formulas.push(f);return id}safe=safe.replace(/\$\$([\s\S]*?)\$\$/g,(_,f)=>protect("\\("+f.trim()+"\\)"));safe=safe.replace(/\\\[([\s\S]*?)\\\]/g,(_,f)=>protect("\\("+f.trim()+"\\)"));safe=safe.replace(/\\\(([\s\S]*?)\\\)/g,(_,f)=>protect("\\("+f.trim()+"\\)"));safe=safe.replace(/(?<!\$)\$([^$\n]+?)\$(?!\$)/g,(_,f)=>protect("\\("+f.trim()+"\\)"));safe=safe.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");safe=safe.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h3>$1</h3>").replace(/^# (.*)$/gm,"<h3>$1</h3>");safe=safe.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");safe=safe.replace(/^\s*[-*] (.*)$/gm,"<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)/g,"<ul>$1</ul>").replace(/\n/g,"<br>");formulas.forEach((f,i)=>safe=safe.replace(`___FORMULA_${i}___`,f));return safe}
function addStoredMessage(role,text){const c=ensureConversation(text);c.messages.push({role,text});c.updatedAt=Date.now();if(role==="user"&&c.messages.filter(m=>m.role==="user").length===1)c.title=text.replace(/\s+/g," ").slice(0,42)||"Nouvelle conversation";conversations.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));saveConversations();renderHistory()}
async function sendMessage(){const problem=questionInput.value.trim();if(!problem||sending)return;sending=true;sendButton.disabled=true;questionInput.disabled=true;welcome.style.display="none";addStoredMessage("user",problem);appendMessage("user",problem);questionInput.value="";questionInput.style.height="auto";const loadingRow=appendMessage("assistant","",{loading:true});try{const response=await fetch("/api/solve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({problem})});const raw=await response.text();let data;try{data=raw?JSON.parse(raw):{}}catch(e){throw new Error("Le serveur n’a pas renvoyé du JSON valide.")}if(!response.ok)throw new Error(data.error||data.message||`Erreur du serveur (${response.status}).`);const answer=data.answer??data.response??data.text??data.result;if(typeof answer!=="string"||!answer.trim())throw new Error(data.error||"Le serveur n’a pas renvoyé de réponse. Vérifiez /api/solve et la clé API Gemini sur Render.");loadingRow.remove();addStoredMessage("assistant",answer);appendMessage("assistant",answer)}catch(e){loadingRow.remove();const message="Désolé, IsidoreAI n’a pas pu répondre. "+(e&&e.message?e.message:"Vérifiez votre connexion puis réessayez.");addStoredMessage("assistant",message);appendMessage("assistant",message);showToast("Échec de la réponse : consultez le message dans la conversation.")}finally{sending=false;sendButton.disabled=false;questionInput.disabled=false;questionInput.focus()}}
composer.addEventListener("submit",e=>{e.preventDefault();sendMessage()});questionInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();composer.requestSubmit()}});questionInput.addEventListener("input",()=>{questionInput.style.height="auto";questionInput.style.height=Math.min(questionInput.scrollHeight,180)+"px"});
$("#newChatButton").addEventListener("click",newConversation);$("#newChatTopButton").addEventListener("click",newConversation);$("#menuButton").addEventListener("click",openMenuPanel);overlay.addEventListener("click",closeMenuPanel);$("#themeButton").addEventListener("click",()=>{document.body.classList.toggle("dark");const dark=document.body.classList.contains("dark");localStorage.setItem("isidoreai_dark",dark?"1":"0");$("#themeButton").textContent=dark?"☀️ Mode clair":"🌙 Mode sombre"});$("#clearHistoryButton").addEventListener("click",()=>{if(!confirm("Voulez-vous vraiment effacer toutes les conversations enregistrées sur cet appareil ?"))return;conversations=[];activeId=null;saveConversations();renderConversation();closeMenuPanel()});document.querySelectorAll(".suggestion").forEach(b=>b.addEventListener("click",()=>{questionInput.value=b.dataset.prompt||"";questionInput.focus();questionInput.style.height="auto";questionInput.style.height=Math.min(questionInput.scrollHeight,180)+"px"}));if(localStorage.getItem("isidoreai_dark")==="1"){document.body.classList.add("dark");$("#themeButton").textContent="☀️ Mode clair"}loadConversations();renderConversation();
</script></body></html>
